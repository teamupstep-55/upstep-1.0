# Render "Blueprint": New + > Blueprint > pick this repository. Free plan = the service sleeps after 15 minutes without traffic;
# the keep-alive workflow in .github/workflows keeps it awake. Do NOT use Render's free Postgres (it expires): use Supabase or Neon.
services:
  - type: web
    name: upstep
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PRODUCTION
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL            # Supabase/Neon connection string
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: resumes
      - key: SITE_URL                # https://YOUR-SERVICE.onrender.com (or your own domain later)
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: EMAIL_DAILY_LIMIT
        value: "100"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
