# Free hosts put the app to sleep after ~15 idle minutes (the next visitor then waits about a minute). This pings it so it stays awake.
# Setup: GitHub repo > Settings > Secrets and variables > Actions > New secret:  SITE_URL = https://YOUR-SERVICE.onrender.com
# GitHub may delay scheduled runs, so this is a strong help, not a guarantee.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 "${{ secrets.SITE_URL }}/api/health"
